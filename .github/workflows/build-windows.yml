name: Version Windows prête à l'emploi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Construction
        shell: cmd
        run: >
          pyinstaller --noconfirm --windowed --name CorrecteurAnnales
          --collect-data pptx --collect-data docx --collect-all pymupdf
          --add-data "config.exemple.toml;."
          lanceur.py
      - name: Fichiers d'accompagnement
        shell: cmd
        run: |
          copy README.md dist\CorrecteurAnnales\
          copy config.exemple.toml dist\CorrecteurAnnales\
          mkdir dist\CorrecteurAnnales\cours
      - uses: actions/upload-artifact@v4
        with:
          name: CorrecteurAnnales-windows
          path: dist/CorrecteurAnnales
