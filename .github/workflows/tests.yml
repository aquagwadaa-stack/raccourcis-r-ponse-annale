name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliothèques d'affichage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -rs
      - name: Scripts d'installation (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -q -r requirements.txt
          .venv\Scripts\python.exe -m correcteur preparer
          .venv\Scripts\python.exe -m correcteur indexer
          .venv\Scripts\python.exe -m correcteur --version
