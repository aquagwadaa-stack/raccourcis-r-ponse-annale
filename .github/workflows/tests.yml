name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliothèques d'affichage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -v -rs -o faulthandler_timeout=90
      - name: Scripts d'installation (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call installer.bat < nul
          if not exist .venv\Scripts\pythonw.exe exit /b 1
          if not exist config.toml exit /b 1
          if not exist cours exit /b 1
          echo Le pancreas secrete l'insuline. > cours\essai.txt
          call indexer_cours.bat < nul
          .venv\Scripts\python.exe -m correcteur chercher "insuline pancreas"
          if errorlevel 1 exit /b 1
          call diagnostic.bat < nul
          .venv\Scripts\python.exe -m correcteur --version
      - name: Installation de Claude Code par connecter_claude.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CORRECTEUR_TEST_SANS_CONNEXION: "1"
        run: |
          call connecter_claude.bat < nul
          if not exist "%USERPROFILE%\.local\bin\claude.exe" exit /b 1
          "%USERPROFILE%\.local\bin\claude.exe" --version
          "%USERPROFILE%\.local\bin\claude.exe" auth status --json
          .venv\Scripts\python.exe -m correcteur diagnostic > diagnostic.txt
          type diagnostic.txt
          rem Sans compte connecté, le correcteur doit trouver Claude Code et renvoyer vers connecter_claude.bat.
          findstr /c:"connecter_claude.bat" diagnostic.txt
          if errorlevel 1 exit /b 1
      - name: Bureau Windows réel (transparence, raccourci)
        if: runner.os == 'Windows'
        run: python tests/windows_real_check.py
